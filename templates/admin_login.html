<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #1e1e2f; color: white; font-family: 'Poppins', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #27293d; padding: 40px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); width: 350px; text-align: center; }
        h2 { margin-bottom: 30px; color: #1d8cf8; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #1e1e2f; border: 1px solid #2b3553; color: white; border-radius: 5px; outline: none; }
        input:focus { border-color: #1d8cf8; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #1d8cf8, #e14eca); border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.02); }
        .error { color: #fd5d93; font-size: 12px; margin-bottom: 15px; }
        .back-link { display: block; margin-top: 20px; color: #9a9a9a; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>WAF Control Center</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="text" name="username" placeholder="Admin Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
        <a href="/" class="back-link">← Back to Website</a>
    </div>
</body>
</html>
